[package]
name = "training-ground"
version = "0.1.0"
description = "Minimalist local coding training ground"
authors = ["yashv"]
edition = "2021"

[lib]
name = "training_ground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The `windows` crates compile billions of API stubs and OOM rustc (16 GB
# machine) when debug info is attached. Strip it for the giant members.
# NOTE: widening this list to the whole `windows-*` family forces a full
# dependency-tree rebuild, which this machine can only afford when commit
# charge is low — do it together with a `cargo test -j 1` session.
[profile.dev.package."windows"]
debug = false
[profile.dev.package."windows-sys"]
debug = false
[profile.test.package."windows"]
debug = false
[profile.test.package."windows-sys"]
debug = false
[profile.dev.package."tauri"]
debug = 1
[profile.test.package."tauri"]
debug = 1
# Line-tables-only debug info across dev/test: full debuginfo=2 blows the
# commit limit on this 16 GB machine when all deps build for tests.
[profile.dev]
debug = 1
[profile.test]
debug = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }
futures-util = "0.3"
regex = "1"
pdf-extract = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_IO",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
